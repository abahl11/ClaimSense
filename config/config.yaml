# Central configuration for the wc-claim-cost project.
# Every tunable value lives here; code reads it through src/config.py.
# Relative paths are resolved against the project root, not the current directory.
# Sections follow the pipeline order: data -> cleaning -> split -> features -> models -> reports.

# The single seed used by every stochastic component (splits, models, Optuna).
random_seed: 42

paths:
  raw_data: data/raw/train.csv
  processed_dir: data/processed
  clean_data: data/processed/claims_clean.parquet
  models_dir: models
  reports_dir: reports
  figures_dir: reports/figures
  metrics_dir: reports/metrics
  data_quality_report: reports/data_quality_report.md
  data_quality_metrics: reports/metrics/data_quality.json
  eda_report: reports/eda.md
  eda_metrics: reports/metrics/eda.json
  features_report: reports/features.md
  features_metrics: reports/metrics/features.json
  regression_model: models/regression_model.joblib
  classifier_model: models/classifier_model.joblib
  validation_metrics: reports/metrics/validation.json
  regression_metrics: reports/metrics/regression.json
  best_params: reports/metrics/best_params.json
  classifier_metrics: reports/metrics/classifier.json
  explainability_metrics: reports/metrics/explainability.json
  fairness_metrics: reports/metrics/fairness.json
  results_report: reports/results.md
  explainability_report: reports/explainability.md
  model_card: reports/model_card.md
  interview_prep: reports/resume_and_interview_prep.md
  readme: README.md
  log_file: logs/pipeline.log

logging:
  level: INFO
  format: "%(asctime)s | %(levelname)-7s | %(name)s | %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"
  quiet_loggers: [urllib3, matplotlib] # WARNING+ only

data:
  source_url: https://www.kaggle.com/competitions/actuarial-loss-estimation
  # Logical name -> column name in the source file. Code refers to logical names only
  # (cfg.col("weekly_wages")), and the validate stage checks the file has every column here.
  columns:
    claim_id: ClaimNumber
    accident_date: DateTimeOfAccident
    report_date: DateReported
    age: Age
    gender: Gender
    marital_status: MaritalStatus
    dependent_children: DependentChildren
    dependents_other: DependentsOther
    weekly_wages: WeeklyWages
    part_time: PartTimeFullTime
    hours_per_week: HoursWorkedPerWeek
    days_per_week: DaysWorkedPerWeek
    description: ClaimDescription
    initial_estimate: InitialIncurredCalimsCost # the "Calims" typo is in the source file
    target: UltimateIncurredClaimCost
  date_columns: [accident_date, report_date]
  datetime_format: "%Y-%m-%dT%H:%M:%SZ" # all timestamps share one zone, so they are kept tz-naive
  numeric_columns:
    - age
    - dependent_children
    - dependents_other
    - weekly_wages
    - hours_per_week
    - days_per_week
    - initial_estimate
    - target
  categorical_columns: [gender, marital_status, part_time]
  codes:
    part_time: P
    full_time: F
  inspect_head_rows: 5

# Phase 1: deterministic cleaning rules (src/data/clean.py).
# Every threshold is fixed here in advance; nothing is learned from the data, so the same
# rules apply to new claims at prediction time. Invalid values become NaN and are imputed
# later inside the model pipeline, fit on training rows only.
cleaning:
  hours_per_week_max: 100 # above this means more than 14 hours every day of the week
  hours_per_day_max: 24 # physical limit for hours / days worked
  days_per_week_range: [1, 7]
  weekly_wage_min: 10 # below this cannot be a real weekly wage for any hours worked
  hourly_wage_min: 1.0 # far below any minimum or junior wage in the data period
  categories: # keyed by logical column name
    gender: { valid: [M, F, U], fill: U }
    marital_status: { valid: [M, S, U], fill: U }
    part_time: { valid: [P, F], fill: null } # null means set to missing
  unknown_category: U
  text_bad_codepoints: [0xFFFD] # U+FFFD replacement character, left by an encoding error
  text_missing_fill: ""
  # Plausibility checks: counted and reported, values kept as recorded.
  flags:
    young_age_below: 16
    old_age_above: 70
    high_weekly_wage_above: 2000
    heaped_wage_values: [200, 500]
    part_time_hours_at_least: 38
    full_time_hours_below: 20
    suspect_accident_hour: 0
    nominal_initial_estimate_max: 1
    long_report_delay_days: 365
  examples_per_rule: 5 # sample affected rows shown in the data quality report

split:
  date_column: accident_date
  # The most recent 20% of claims by accident date form the final test set, used once at the end.
  test_fraction: 0.20
  # Time-ordered cross-validation inside the training period (Phase 4): each fold trains on
  # earlier accident dates and validates on the block that follows, like the final test.
  cv_folds: 5
  # The most recent share of a training set, used to calibrate the high-cost probabilities
  # and set the review threshold out of time (Phase 6).
  inner_holdout_fraction: 0.20

# A claim is "high cost" if its ultimate cost is at or above this quantile of the TRAINING
# target. The same cutoff is applied to the test set (Phase 6); EDA uses it too.
labels:
  high_cost_quantile: 0.90

# Phase 3: engineered features (src/features/tabular.py, build.py).
features:
  # Band edges for grouped features. Bands include their lower edge; the last band is open.
  age_band_edges: [0, 20, 25, 30, 35, 40, 45, 50, 55, 60, 65]
  wage_band_edges: [0, 200, 300, 400, 500, 750, 1000, 1500]
  delay_band_edges: [0, 8, 15, 31, 61, 91, 181, 366] # days from accident to report
  dependents_cap: 3 # 3 or more dependents are grouped together
  # Night shift: accident hour after 20 or before 6. Accidents recorded at exactly 00:00 are
  # treated as "time unknown" (see the data quality report) and are NOT counted as night shift.
  night_after_hour: 20
  night_before_hour: 6
  weekend_days: [5, 6] # pandas weekday numbers (Monday = 0): Saturday and Sunday
  min_hours_for_rate: 1.0 # hours are clipped up to this before computing the hourly wage
  # Initial-estimate values that behave like placeholders. Evidence: reports/features.md.
  initial_default_values: [500]
  # Missing hours, days and wages are imputed with the median of the claimant's
  # part-time / full-time group, learned on training rows only, plus a missing indicator.
  impute_group: part_time
  impute_columns: [weekly_wages, hours_per_week, days_per_week]
  missing_indicator_suffix: _was_missing
  # Model inputs by preprocessing branch. Logical names are resolved to source columns.
  numeric: # median-imputed, then standardised
    - age
    - dependent_children
    - dependents_other
    - total_dependents
    - hours_per_week
    - days_per_week
    - hours_per_day
    - accident_year
    - accident_hour
    - log_weekly_wages
    - log_initial_estimate
  log_numeric: # right-skewed: median-imputed, log1p, then standardised
    - report_delay_days
    - hourly_wage
    - initial_to_wage_ratio
  binary: # 0/1 flags, passed through unchanged
    - is_weekend
    - is_night_shift
    - accident_time_unknown
    - is_part_time
    - wage_is_default
    - initial_is_default
    - initial_is_nominal
    - weekly_wages_was_missing
    - hours_per_week_was_missing
    - days_per_week_was_missing
  categorical: [gender, marital_status, age_band, accident_month, accident_weekday] # one-hot
  text_rule_categorical: [body_part, injury_nature, injury_cause] # one-hot (keyword rules)
  text_rule_numeric: [num_body_parts_mentioned, description_length] # standardised (keyword rules)
  onehot_min_frequency: 20 # rarer categories are grouped into one "infrequent" column

# Whether the model sees the keyword-rule features of the description. The Phase 5 ablation
# switches them off to measure what the description adds.
text_layers:
  rules: true # keyword taxonomy (body part, injury nature, injury cause)

# Keyword taxonomy for ClaimDescription (src/features/text_rules.py). Keywords match
# whole words. For injury_nature and injury_cause the categories are in PRIORITY order: when a
# description matches several, the first listed wins (natures are ordered roughly by
# severity). For body_part, one distinct part gives that part and two or more give "multiple".
text_rules:
  other_label: other
  multiple_label: multiple
  multiple_keywords: [MULTIPLE]
  # child: parent. When both are mentioned, only the child counts ("HAND ... FINGER" -> finger),
  # so "multiple" means separate areas of the body, not a part and its location.
  body_part_parents:
    finger: hand
  body_part:
    back: [BACK, LUMBAR, SPINE, SPINAL, COCCYX, TAILBONE, TAIL BONE, DISC, VERTEBRA, VERTEBRAE, SCIATICA]
    knee: [KNEE, KNEES, KNEECAP, PATELLA, MENISCUS]
    shoulder: [SHOULDER, SHOULDERS, ROTATOR, CLAVICLE, COLLARBONE]
    hand: [HAND, HANDS, PALM, KNUCKLE, KNUCKLES]
    finger: [FINGER, FINGERS, THUMB, THUMBS, FINGERTIP, FINGERNAIL]
    wrist: [WRIST, WRISTS, CARPAL]
    arm: [ARM, ARMS, FOREARM, FOREARMS, ELBOW, ELBOWS, BICEP, BICEPS, TRICEP]
    leg: [LEG, LEGS, THIGH, THIGHS, SHIN, SHINS, CALF, CALVES, HIP, HIPS, HAMSTRING]
    foot: [FOOT, FEET, TOE, TOES, HEEL, HEELS, INSTEP]
    ankle: [ANKLE, ANKLES, ACHILLES]
    eye: [EYE, EYES, CORNEA, CORNEAL, EYELID, RETINA, CONJUNCTIVITIS]
    head: [HEAD, FACE, FACIAL, FOREHEAD, SKULL, SCALP, NOSE, LIP, LIPS, MOUTH, TEETH, TOOTH, JAW, EAR, EARS, CHEEK, CHIN, CONCUSSION]
    neck: [NECK, WHIPLASH, CERVICAL]
    trunk: [CHEST, RIB, RIBS, ABDOMEN, ABDOMINAL, STOMACH, GROIN, INGUINAL, PELVIS, BUTTOCK, BUTTOCKS, TORSO]
  injury_nature:
    amputation: [AMPUTATION, AMPUTATED, SEVERED]
    fracture: [FRACTURE, FRACTURED, FRACTURES, BROKEN, BROKE, DISLOCATION, DISLOCATED]
    crush: [CRUSH, CRUSHED, CRUSHING, SQUASHED, SQUASHING]
    burn: [BURN, BURNS, BURNT, BURNED, BURNING, SCALD, SCALDED, SCALDING, FLASH]
    puncture: [PUNCTURE, PUNCTURED, NEEDLESTICK, NEEDLE, STABBED, STAB, PENETRATING]
    laceration: [LACERATION, LACERATIONS, LACERATED, CUT, CUTS, GASH, GASHED, WOUND, ABRASION, ABRASIONS, GRAZE, GRAZED]
    foreign_body: [FOREIGN BODY, SPLINTER, SPLINTERS, PARTICLE, PARTICLES, GRIT, SWARF]
    hernia: [HERNIA, HERNIAS]
    inflammation: [SYNOVITIS, TENOSYNOVITIS, TENDONITIS, TENDINITIS, EPICONDYLITIS, BURSITIS, INFLAMMATION, INFLAMED, CARPAL TUNNEL, CARPEL TUNNEL, TENNIS ELBOW]
    sprain: [SPRAIN, SPRAINED, SPRAINS, SPRAINING, LIGAMENT, LIGAMENTS, TORN CARTILAGE]
    strain: [STRAIN, STRAINED, STRAINS, STRAINING, WHIPLASH, MUSCLE, MUSCLES]
    contusion: [CONTUSION, CONTUSIONS, BRUISE, BRUISED, BRUISES, BRUISING]
    infection: [INFECTION, INFECTIONS, INFECTED]
    psychological: [STRESS, ANXIETY, DEPRESSION, DEPRESSED, PSYCHOLOGICAL]
    bite_sting: [BITE, BITES, BITTEN, STING, STUNG]
    dermatitis: [DERMATITIS, RASH, ALLERGIC, ALLERGY, ECZEMA]
    soft_tissue: [SOFT TISSUE]
    pain: [PAIN, PAINS, SORE, ACHE, ACHING]
  injury_cause:
    caught_in: [CAUGHT, JAMMED, TRAPPED, PINCHED]
    vehicle: [MOTOR VEHICLE, VEHICLE ACCIDENT, CAR ACCIDENT, TRUCK ACCIDENT, COLLISION, MVA, REAR ENDED, ROLLED VEHICLE]
    assault: [ASSAULT, ASSAULTED, PUNCHED, KICKED, ATTACKED]
    slip_fall: [SLIPPED, SLIP, SLIPPING, FELL, FALL, TRIPPED, TRIP, TRIPPING, STUMBLED, LOST FOOTING, LOST BALANCE]
    struck_by: [STRUCK, HIT, BUMPED, KNOCKED, BANGED, DROPPED]
    repetitive: [REPETITIVE, REPETITION, REPEATED, OVERUSE, CONSTANT, TYPING, KEYBOARD]
    lifting: [LIFTING, LIFTED, LIFT, CARRYING, CARRIED, PUSHING, PUSHED, PULLING, LOADING, UNLOADING]
    bending_twisting: [BENDING, BENT, TWISTING, TWISTED, REACHING, TURNED, TURNING, STRETCHING, SQUATTING, KNEELING]
    tool_use: [KNIFE, KNIVES, GRINDING, GRINDER, CUTTING, SAW, BANDSAW, BLADE, DRILL, DRILLING, WELDING, WELDER, SLICER, SLICING, HAMMER, CHISEL, LATHE, SCISSORS, NEEDLE, NEEDLESTICK, SYRINGE]
    exposure: [HOT, CHEMICAL, CHEMICALS, SPLASHED, FUMES, STEAM, ELECTRIC, ELECTRICAL, SHOCK, NOISE, DUST]
    animal_insect: [SPIDER, REDBACK, DOG, INSECT, SNAKE, BEE, WASP]
  unmatched_examples: 10 # sample unmatched descriptions shown per field in features.md

# Phase 4: evaluation settings shared by the regression and classification stages.
evaluation:
  # Model selection uses RMSE on the log scale: relative errors count equally for small and
  # large claims, so a handful of huge claims cannot dominate the choice.
  selection_metric: rmsle
  n_deciles: 10 # predicted-cost deciles in the calibration table
  review_capacities: [0.05, 0.10, 0.20] # shares of claims a review team could look at
  review_capacity: 0.10 # the team reviews 10% of claims: sets the classifier threshold
  reliability_bins: 10
  largest_claim_quantiles: [0.90, 0.99] # "top 10%" and "top 1%" of actual cost (error analysis)
  min_group_size: 100 # smallest group shown in grouped error tables

# Phase 5: regression models (src/models/train_regression.py). All fits use random_seed.
regression:
  n_jobs: -1
  lightgbm_common: { deterministic: true, force_col_wise: true, verbose: -1 }
  ridge: { alpha: 1.0 }
  random_forest: { n_estimators: 200, min_samples_leaf: 20, max_features: 0.3 }
  lightgbm:
    n_estimators: 600
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 50
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0
  tweedie_variance_powers: [1.5, 1.7, 1.9] # plus the Gamma loss (power 2)
  # Price-drift approach C/D: log-linear cost trend fitted on the most recent training years,
  # used to bring every claim to the price level of the latest training date and back.
  trend_window_years: 5
  # Ablation: the keyword-rule features are kept only if they beat the no-text model by more
  # than this (CV RMSLE).
  ablation_tolerance: 0.001
  interval_quantiles: [0.1, 0.5, 0.9] # 80% prediction interval plus a median model
  smearing_folds: 5 # out-of-fold residuals for the retransformation (smearing) factor

# Phase 5: Optuna search for the chosen configuration (CV on training data only). One search
# space per model family, so whichever family wins stage 1 can be tuned.
tuning:
  n_trials: 25
  space: # [low, high]; rates, leaf sizes and penalties are searched on a log scale
    lightgbm:
      learning_rate: [0.02, 0.1]
      n_estimators: [200, 1000]
      num_leaves: [15, 63]
      min_child_samples: [20, 300]
      colsample_bytree: [0.4, 1.0]
      subsample: [0.5, 1.0]
      reg_lambda: [0.001, 10.0]
    random_forest:
      n_estimators: [100, 400]
      min_samples_leaf: [5, 100]
      max_features: [0.1, 0.6]
    ridge:
      alpha: [0.01, 100.0]

# Phase 6: high-cost claim classifier (src/models/train_classifier.py).
classifier:
  logistic: { C: 1.0, max_iter: 3000 }
  # LightGBM uses the default regression settings above, plus class weighting.
  class_weighting: balanced # scale_pos_weight = negatives / positives in the training rows

# Phase 7: explainability and fairness.
explain:
  shap_sample: 2000 # test claims explained with SHAP
  shap_sample_forest: 200 # exact SHAP on deep random forests is slow, so fewer claims
  top_features: 15
  dependence_features: 4
  example_quantiles: [0.10, 0.50, 0.95] # low, medium and high predicted-cost example claims
  waterfall_features: 10
fairness:
  # Excluded: the with/without comparison (reports/explainability.md) showed no
  # measurable accuracy benefit, below the pre-set negligible_rmsle_change.
  exclude_gender: true
  min_group_size: 30
  negligible_rmsle_change: 0.002 # smaller CV RMSLE changes count as "no accuracy benefit"

# Streamlit app (app/streamlit_app.py): example claim pre-filled in the form.
app:
  title: Workers' comp claim triage
  top_drivers: 8
  claim_id: NEW_CLAIM
  limits: { age: [13, 90], dependents_max: 10 }
  defaults:
    accident_date: "2004-03-15"
    accident_time: "10:00"
    report_date: "2004-04-02"
    age: 45
    gender: M
    marital_status: M
    dependent_children: 0
    dependents_other: 0
    weekly_wages: 650.0
    part_time: F
    hours_per_week: 38.0
    days_per_week: 5
    description: "LIFTING HEAVY BOX STRAINED LOWER BACK"
    initial_estimate: 5000

# Phase 2: exploratory analysis (src/analysis/eda.py). Uses training claims only, except
# the trend-over-time section, which shows every accident year to describe the drift.
eda:
  min_group_size: 100 # smallest group eligible to be called "most expensive"
  adjuster_tolerance: 0.25 # initial estimate "close" if within +/-25% of the ultimate cost
  adjuster_large_miss_factor: 2.0 # "large miss" if off by more than 2x in either direction
  hexbin_gridsize: 60
  weak_correlation: 0.10 # |rank correlation| below this is described as weak
  common_values_shown: 3 # most common initial-estimate values quoted in the text
  label_collision_gap: 0.05 # skip end labels closer than this share of the y-range
  # Claim-mix controls for the mix-adjusted cost index. Wages are deliberately excluded:
  # they rise with inflation, so controlling for them would hide the price change.
  index_controls: [injury_nature, body_part, injury_cause, age_band, part_time]

reporting:
  project_name: "Workers' Comp Claim Severity Prediction & Early Triage"
  target_percentiles: [0.01, 0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95, 0.99, 0.999]
  reference_percentiles: [0.50, 0.90, 0.99] # marked on the target histogram
  raw_hist_clip_percentile: 0.99 # raw-scale histogram is cut here so the bulk is visible
  top_share_fractions: [0.01, 0.10] # share of total cost carried by the largest claims
  hour_comparison_window: [1, 4] # hours compared against the suspect 00:00 count
  recent_years: 2 # "last N accident years" used when describing recording changes

# Figure style, shared by every report. Colours are the validated reference palette
# from the dataviz method: slots are used in this fixed order, never cycled.
plots:
  dpi: 150
  width: 10
  height: 4.5
  font_family: ["Segoe UI", "DejaVu Sans"]
  font_size: 10
  line_width: 2
  hist_bins: 60
  surface: "#fcfcfb"
  ink_primary: "#0b0b0b"
  ink_secondary: "#52514e"
  ink_muted: "#898781"
  gridline: "#e1e0d9"
  baseline: "#c3c2b7"
  de_emphasis: "#c3c2b7"
  categorical: ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"]
  # Single-hue blue ramp (light to dark) for magnitude, e.g. hexbin density.
  sequential: ["#cde2fb", "#9ec5f4", "#6da7ec", "#3987e5", "#256abf", "#184f95", "#0d366b"]
